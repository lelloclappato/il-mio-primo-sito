<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- colore della barra del browser sul telefono, per tema chiaro e scuro -->
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)">
<title>Abitudini</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- "preload": il browser scarica subito i font, senza aspettare di leggere il CSS -->
<link rel="preload" href="fonts/plus-jakarta-sans-latin-variabile.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-latin-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Sezioni"><div class="in" id="tabs"></div></nav>
<div id="modal"></div>
<!-- invisibile: i lettori di schermo leggono ad alta voce quello che ci scrive annuncia() -->
<div id="annuncio" class="sr-only" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<!-- type="module": il file può importare funzioni dagli altri file in js/ -->
<script type="module" src="js/app.js"></script>
</body>
</html>
